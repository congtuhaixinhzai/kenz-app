name: Build Mobile Apps (Android APK & iOS)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Web Bundle (www)
        run: |
          python build_mobile.py

      - name: Install Dependencies
        run: |
          npm install

      - name: Add Android Native Platform
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Karaoke-Kenz-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  build-ios:
    name: Prepare iOS Xcode Project
    runs-on: macos-14
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Web Bundle (www)
        run: |
          python3 build_mobile.py

      - name: Install Dependencies
        run: |
          npm install

      - name: Add iOS Native Platform
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: Upload iOS Xcode Project Bundle
        uses: actions/upload-artifact@v4
        with:
          name: Karaoke-Kenz-iOS-XcodeProject
          path: ios/
          retention-days: 14
